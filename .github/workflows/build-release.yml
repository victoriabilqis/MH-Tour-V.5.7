
name: MH Tour APK Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project, UI assets, and button wiring
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          test -f android/app/src/main/res/drawable/mh_tour_logo.png
          test -f android/app/src/main/res/drawable/donation_qr.png
          test -f android/app/src/main/res/drawable/home_reference.webp

          grep -q '^android.useAndroidX=true$' android/gradle.properties
          grep -q '^android.enableJetifier=true$' android/gradle.properties
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -q 'jvmTarget = "17"' android/app/build.gradle.kts
          grep -q 'io.livekit:livekit-android:2.28.2' android/app/build.gradle.kts
          grep -q 'newRoom.connect(' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'mhtour-19kg8e' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'DANA • Donasi Langsung' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'Tekan sekali lagi untuk keluar' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'Akhiri Sesi' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'Sesi baru tidak dapat dibuat' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'Lihat Room & Daftar Jemaah' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'remoteParticipants' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'talk.text = "Mute"' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          grep -q 'talk.text = if (micEnabled) "Mute"' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          ! grep -R -n 'secrets\.MH_KEYSTORE_BASE64' .github/workflows
          ! grep -q 'onRequestPermissionsResult' android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          # Every interactive button/zone declared by MainActivity must have a click handler.
          for symbol in jamaahBtn guideBtn donationBtn download dana back create shareQr roomBtn end talk mute scan join; do
            if [ "$symbol" = "roomBtn" ]; then
              grep -q 'roomBtn.setOnClickListener' android/app/src/main/java/com/mhtour/audio/MainActivity.kt
            else
              grep -q "${symbol}\.setOnClickListener" android/app/src/main/java/com/mhtour/audio/MainActivity.kt
            fi
          done

          grep -q 'buildConfigField' android/app/build.gradle.kts
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          echo 'Preflight and button-wiring checks passed.'

      - name: Create temporary release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mh-tour-release.jks" \
            -storetype JKS \
            -alias mh-tour-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=MH Tour, OU=Mobile, O=MH Tour, L=Indonesia, ST=West Java, C=ID"

      - name: Build signed Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            -PMH_KEYSTORE_FILE="$RUNNER_TEMP/mh-tour-release.jks" \
            -PMH_KEYSTORE_PASSWORD=changeit \
            -PMH_KEY_ALIAS=mh-tour-release \
            -PMH_KEY_PASSWORD=changeit \
            clean assembleRelease

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          file "$APK"
          echo "=== MH TOUR RELEASE APK BERHASIL DIBUAT ==="
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-V5.4-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
